/* Visible color choices and unmistakable activation states. */
.card.is-active{background:#172c25;border-color:#478f72;box-shadow:inset 4px 0 0 #8ed8b6}
.card.is-active .cardtop{background:#1e3b30}
.card.is-active .cardbody{border-top-color:#3c6654}
.card.inactive{opacity:1;background:#10161b;border-color:#303b42;box-shadow:none}
.card.inactive .cardtop{background:#141c22}
.card.inactive .cardname{color:#a3b0b7}
.card.inactive .cardsummary{color:#7f9099}
.card.inactive .cardbody{border-top-style:dashed;border-top-color:#34414a}
.card-state{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:650;vertical-align:middle;padding:2px 6px;border-radius:5px;letter-spacing:.025em;margin-left:5px}
.card-state.on{background:#9ee6bf;color:#123425}
.card-state.off{background:#27323a;color:#aab7c0;border:1px solid #44515b}
.cardactions .cardstatus-toggle{width:auto;min-width:58px;padding:6px 9px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}
.cardactions .cardstatus-toggle.on{background:#9ee6bf;color:#143326;border-color:#b7f3d2}
.cardactions .cardstatus-toggle.on:hover{background:#c1f3d8}
.cardactions .cardstatus-toggle.off{background:#202a33;color:#b4c2cb;border-color:#54636f}
.cardactions .cardstatus-toggle.off:hover{background:#30413b;color:#d7f1e2;border-color:#8fbaa6}
.swatch{width:12px;height:12px;border:1px solid #ffffff6b;box-shadow:0 0 0 2px #0003}
.fieldvalue.is-color{background:var(--value-color);color:var(--value-ink);border-color:#ffffff40;box-shadow:inset 0 0 0 1px #0002}
.fieldvalue.is-color:hover{background:var(--value-color);color:var(--value-ink);border-color:#a8dfc4;box-shadow:0 0 0 2px #96dfbd55}
.fieldvalue.is-color .arrow{color:inherit;opacity:.7}
.optionrow.has-color>button:first-child{background:var(--value-color);color:var(--value-ink);border-color:#ffffff45}
.optionrow.has-color>button:first-child:hover{background:var(--value-color);color:var(--value-ink);box-shadow:0 0 0 2px #9ee6bf88}
.optionrow.has-color>button:first-child small{color:inherit;opacity:.8}
.optionlist.color-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-height:min(52dvh,450px);padding:4px 5px 4px 3px;align-items:start}
.color-options .optionrow{display:grid;grid-template-columns:minmax(0,1fr) 29px 29px;gap:3px;align-items:center;padding:4px;border:1px solid #34444d;border-radius:11px;background:#101a20;min-width:0}
.color-options .optionrow>button:first-child{grid-column:1/-1;min-height:72px;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:17px 9px;font-size:12px;font-weight:650;line-height:1.35;border-radius:7px;min-width:0;overflow-wrap:anywhere}
.color-options .optionrow.selected{border-color:#c4f7df;box-shadow:0 0 0 2px #7fc9a7}
.color-options .optionrow.selected>button:first-child{border-color:#ffffff70}
.color-options .optionrow>button.icon{padding:2px;min-width:27px;min-height:27px;font-size:12px}
.color-options .tile-state{padding-left:3px;font-size:9px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-check{font-size:10px;position:absolute;right:5px;top:5px;background:var(--value-ink,#d9f2e4);color:var(--value-color,#132a20);border-radius:50%;width:17px;height:17px;display:grid;place-items:center;line-height:1}
.color-options .optionrow.banned>button:first-child{opacity:.55}
.optionrow.available-active>button:first-child{border-color:#65a184;background:#244235;color:#c9f1db}
.optionrow.available-active>button:first-child small{color:#9bd4b4}
@media(max-width:600px){.optionlist.color-options{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card-state{font-size:8px;padding:2px 4px;margin-left:3px}.cardactions .cardstatus-toggle{width:auto;min-width:52px;padding:6px;font-size:10px}.cardtoggle{gap:6px}.color-options .optionrow>button:first-child{min-height:67px}}

.color-families{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 5px}.color-families:empty{display:none}.color-families .chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;font-size:10px}.family-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid #ffffff50}

/* Keep dialog controls reachable while the options scroll. */
dialog[open]{display:flex;flex-direction:column;overflow:hidden}
.dialoghead,.dialogfoot{flex-shrink:0}
.dialogbody{min-height:0;max-height:none;overflow:auto;flex:1}

.sample-options .optionrow>button:first-child{grid-column:1/-1;position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;width:100%;padding:0 0 9px;overflow:hidden;min-height:145px}
.sample-img{display:block;width:100%;height:94px;object-fit:cover;background:#46534d}
.sample-options .tile-label{display:block;padding:8px 8px 0;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.sample-options .optionrow small{padding:0 8px;color:#a4b6b9;font-size:9px}
.sample-options .optionrow.selected{border-color:#c4f7df;box-shadow:0 0 0 2px #7fc9a7}
.sample-options .optionrow.selected>button:first-child{color:#d1ffe8;border-color:#8bceb0;background:#1e352c}

@media(max-width:600px){.optionlist.sample-options{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.sample-img{height:90px}.field-sample{width:30px;height:23px}.fieldvalue{gap:6px}}

.quick-builder{border:1px solid #426d60;border-radius:14px;background:linear-gradient(145deg,#1b302a,#142127);margin-bottom:22px;overflow:hidden}
.quick-builder>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;cursor:pointer;list-style:none}

.quick-extra .quick-grid{margin:5px 0 0}
.quick-roll{width:100%;padding:12px 14px;font-size:13px}
.quick-result{border-top:1px solid #385448;margin-top:14px;padding-top:12px}
.quick-result strong{display:block;font-size:12px;margin:4px 0}
.quick-result>span:last-of-type{display:block;font-size:11px;color:#b5c9bf;line-height:1.65;overflow-wrap:anywhere}
.quick-result p,.quick-error{font-size:11px;color:var(--warm);margin:9px 0 0}

const MODS=[[/\b(pale|light|powder|baby|soft|dusty|pastel)\b/,.32],[/\b(deep|dark|midnight|rich)\b/,-.3],
 [/\b(bright|electric|neon|vivid|hot)\b/,.1]];
function mix(h,t){const n=parseInt(h.slice(1),16);
  let r=n>>16,g=(n>>8)&255,b=n&255;
  if(t>0){r+=(255-r)*t;g+=(255-g)*t;b+=(255-b)*t}else{r*=1+t;g*=1+t;b*=1+t}
  const c=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");
  return "#"+c(r)+c(g)+c(b)}
function colHex(name){
  const t=String(name||"").toLowerCase();
  if(!t||t.startsWith("—"))return null;
  let best=null;
  Object.keys(HEXBASE).forEach(k=>{if(t.includes(k)&&(!best||k.length>best.length))best=k});
  if(!best)return null;
  let hex=HEXBASE[best];
  MODS.forEach(([re,amt])=>{if(re.test(t))hex=mix(hex,amt)});
  return hex;
}

function visualHex(v){
 const name=String(v||'').trim().toLowerCase();if(Lab.isNone(v))return null;

 if(/^#[a-f0-9]{6}$/i.test(name))return name;
 if(/^#[a-f0-9]{3}$/i.test(name))return '#'+[...name.slice(1)].map(c=>c+c).join('');
 if(/blonde/.test(name))return /platinum/.test(name)?'#ece4cb':/ash/.test(name)?'#b4a78c':/strawberry/.test(name)?'#d7a482':/dirty|dark/.test(name)?'#a38c66':/honey/.test(name)?'#c59c55':'#d6b576';
 if(/auburn/.test(name))return '#874b34';

}
function colorPresentation(k,x,v){
 if(!isColorField(k,x))return null;

 const rgb=hex.slice(1).match(/../g).map(h=>parseInt(h,16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);

 const ink=(lum+.05)/.05>=1.05/(lum+.05)?'#000000':'#ffffff';
 return {hex,ink,style:'--value-color:'+hex+';--value-ink:'+ink};
}

 case 'repeat':runVariants('random',true);break;
 case 'sweep':runVariants('sweep');break;
 case 'copyResults':copy(s.results.map((r,i)=>(i+1)+'.\n'+r.prompt).join('\n\n'));break;
 case 'copyResult':copy(s.results.find(r=>r.id===d.id)?.prompt||'');break;
 case 'loadResult':{const r=s.results.find(r=>r.id===d.id),keep={looks:s.looks,chars:s.chars,results:s.results};Lab.checkpoint();Lab.set({...r.snapshot,...keep});state().ui.tab='outfit';render();toast('Variante zum Weiterbearbeiten geladen.');break}
 case 'saveResult':saveLookDialog(s.results.find(r=>r.id===d.id));break;
 case 'export':download('prompt-lab-arbeitsstand.json',JSON.stringify(Lab.serialize(),null,2));toast('Vollständige Sicherung exportiert.');break;
 case 'import':importDialog();break;
 case 'importFile':$('fileInput').click();break;
 case 'inspectCode':inspectCode();break;
 case 'inspectPrompt':inspectPrompt();break;
 case 'acceptCode':Lab.checkpoint();Lab.set(importScan.state);render();closeDialog();toast('Arbeitsstand übernommen.');break;
 case 'acceptPrompt':Lab.importPreview(importScan);render();closeDialog();toast('Angaben übernommen, Originaltext erhalten.');break;
 case 'help':helpDialog();break;
 case 'outputSettings':outputSettings();break;
 case 'close':closeDialog();break;
 }
}
function deleteDialog(title,name,fn){openDialog(title,name||'');$('dialogBody').innerHTML='<p class="tiny muted">Die Änderung lässt sich über Rückgängig wiederherstellen.</p>';$('dialogFoot').innerHTML='<button class="quiet" id="cancelDelete">Behalten</button><button class="danger" id="confirmDelete">Löschen</button>';$('cancelDelete').onclick=closeDialog;$('confirmDelete').onclick=()=>{fn();if($('dialogTitle').textContent===title)closeDialog()}}
// Events use delegation, so collapsed and newly added fields share the same behavior.
document.addEventListener('click',e=>{const t=e.target.closest?.('[data-action]');if(!t)return;try{action(t.dataset.action,t.dataset,t)}catch(err){console.error(err);toast(err.message||'Aktion konnte nicht ausgeführt werden.')}});
$('nav').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t)switchTab(t.dataset.tab)});
document.addEventListener('change',e=>{const el=e.target,s=state();if(el.dataset.quickDesign){quickError='';mutate(()=>{const q=OutfitQuick.normalize(s.settings.quick);q.design[el.dataset.quickDesign]=el.value;s.settings.quick={...s.settings.quick,...OutfitQuick.normalize(q)}},{refresh:false})}else if(el.dataset.quick){quickError='';mutate(()=>{const q=OutfitQuick.normalize(s.settings.quick);q[el.dataset.quick]=el.value;if(el.dataset.quick==='depth')q.groups=OutfitQuick.depthDefaults(el.value);s.settings.quick={...s.settings.quick,...OutfitQuick.normalize(q)}},{refresh:el.dataset.quick==='depth'})}else if(el.dataset.text)mutate(()=>s.text[el.dataset.text]=el.value,{refresh:false});else if(el.dataset.note!==undefined)mutate(()=>s.notes[el.dataset.note]=el.value,{refresh:false});else if(el.dataset.cardnote)mutate(()=>s.records[el.dataset.cardnote].notes=el.value,{refresh:false});else if(el.dataset.weight)mutate(()=>s.records[el.dataset.weight].weight=Number(el.value),{refresh:false});else if(el.dataset.setting){const k=el.dataset.setting;if(k==='recipe'){s.settings.recipe=el.value;save()}else mutate(()=>s.settings[k]=el.type==='checkbox'?el.checked:el.type==='number'||k==='density'?Number(el.value):el.value)}else if(el.id==='count'){const b=document.querySelector('[data-action="variants"]');if(b)b.textContent=Math.max(1,Math.min(100,Number(el.value)||5))+' Varianten erzeugen'}});
document.addEventListener('toggle',e=>{if(e.target.matches?.('details[data-group]')){(state().ui.groups||={})[e.target.dataset.group]=e.target.open;save()}},true);
$('globalSearch').onclick=searchDialog;$('closeDialog').onclick=closeDialog;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))closeDialog()});
$('undo').onclick=()=>{if(Lab.undo()){render();toast('Rückgängig')}};$('redo').onclick=()=>{if(Lab.redo()){render();toast('Wiederholt')}};
$('saveLook').onclick=()=>saveLookDialog();$('showPreview').onclick=()=>$('preview').classList.add('mobile-open');$('hidePreview').onclick=()=>$('preview').classList.remove('mobile-open');
$('copyPrompt').onclick=()=>copy($('output').value);$('promptFile').onclick=()=>download('prompt.txt',$('output').value,'text/plain');$('resetPrompt').onclick=()=>{if(state().draft!==null)action('showAuto',{});else toast('Die Vorschau entspricht bereits deinen Einstellungen.')};
$('visibility').onchange=e=>mutate(()=>state().settings.visibility=e.target.checked);
let editCheckpoint=false;$('output').onfocus=()=>editCheckpoint=false;$('output').addEventListener('input',()=>{const s=state();if(!editCheckpoint){Lab.checkpoint();editCheckpoint=true;s.baseDraft=Lab.assemble()}s.draft=$('output').value;preview();save()});
$('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{importDialog(await file.text());inspectCode()}catch(err){toast(err.message)}e.target.value=''};
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchDialog()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?$('redo').click():$('undo').click()}else if(e.key==='Escape'&&$('preview').classList.contains('mobile-open'))$('preview').classList.remove('mobile-open')});
window.addEventListener('beforeunload',()=>Lab.persist());
const restored=Lab.load();if(!restored&&Lab.storageStatus())Lab.migrateStorage();render();if(Lab.notice())toast(Lab.notice());
window.PromptLab=Lab;
})();
